name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            try {
              const response = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: process.env.RELEASE_TAG,
              });
              if (!response.data.draft) {
                core.info(`${process.env.RELEASE_TAG} is already published.`);
                core.setOutput('publish', 'false');
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('publish', 'true');

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            builder_arch: --x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            builder_arch: --arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Python fallback
        run: |
          pip install pytest
          python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Electron shell
        run: npm run test:electron
      - name: Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full rpm
      - name: Install dependencies
        run: npm install
      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: >-
          npx electron-builder
          --linux AppImage rpm tar.gz
          ${{ matrix.builder_arch }}
          --publish never
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: tvweb-linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: tvweb-linux-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_NAME: TV Web ${{ needs.plan.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const delay = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;
            const name = process.env.RELEASE_NAME;

            let release;
            try {
              const response = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (release && !release.draft) {
              core.info(`${tag} is already published at ${release.html_url}`);
              return;
            }

            if (!release) {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100,
              });
              release = releases.find((candidate) => candidate.tag_name === tag);
            }

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
            }

            if (!release) {
              const response = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name,
                draft: true,
                prerelease: false,
                generate_release_notes: true,
              });
              release = response.data;
            }

            const artifactPaths = fs.readdirSync('dist')
              .map((artifactName) => path.join('dist', artifactName))
              .filter((artifactPath) =>
                artifactPath.endsWith('.AppImage')
                || artifactPath.endsWith('.rpm')
                || artifactPath.endsWith('.tar.gz'),
              );
            if (artifactPaths.length !== 6) {
              throw new Error(`Expected 6 Linux packages, found ${artifactPaths.length}`);
            }

            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });

            for (const artifactPath of artifactPaths) {
              const artifactName = path.basename(artifactPath);
              const duplicate = existingAssets.find((asset) => asset.name === artifactName);
              if (duplicate?.state === 'uploaded' && duplicate.size > 0) {
                core.info(`Keeping existing ${artifactName} (${duplicate.size} bytes)`);
                continue;
              }

              if (duplicate) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: duplicate.id,
                });
                await delay(5000);
              }

              const data = fs.readFileSync(artifactPath);
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  await github.rest.repos.uploadReleaseAsset({
                    owner,
                    repo,
                    release_id: release.id,
                    name: artifactName,
                    headers: {
                      'content-type': 'application/octet-stream',
                      'content-length': data.length,
                    },
                    data,
                  });
                  break;
                } catch (error) {
                  if (attempt === 3) throw error;
                  core.warning(`Upload attempt ${attempt} failed for ${artifactName}: ${error.message}`);
                  await delay(attempt * 10000);
                }
              }
            }

            const published = await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              tag_name: tag,
              target_commitish: context.sha,
              name,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            core.info(`Published ${published.data.html_url}`);
