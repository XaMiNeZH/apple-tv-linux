name: release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install pytest
          python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y libfuse2 p7zip-full
      - name: Build Linux tarball
        run: |
          npm install
          npx electron-builder --linux tar.gz
      - name: Build Linux AppImage
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx electron-builder --linux AppImage
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TV Web ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.AppImage
            dist/*.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
