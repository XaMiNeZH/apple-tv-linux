[project]
name = "tvweb"
version = "0.3.1"
description = "Unofficial Fedora GNOME desktop wrapper for tv.apple.com"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
tvweb = "tvweb.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
