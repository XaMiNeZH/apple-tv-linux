<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">TV Web first-run screen</title>
  <desc id="description">A Fedora desktop window explaining that TV Web opens Apple TV in its own window.</desc>
  <defs>
    <radialGradient id="page" cx="50%" cy="0%" r="85%">
      <stop offset="0" stop-color="#203a62"/>
      <stop offset=".7" stop-color="#08111f"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="18" fill="#20252d"/>
  <path d="M18 0h1164a18 18 0 0 1 18 18v38H0V18A18 18 0 0 1 18 0Z" fill="#303741"/>
  <text x="24" y="36" fill="#f6f5f4" font-family="Cantarell, sans-serif" font-size="18" font-weight="700">TV Web</text>
  <g fill="none" stroke="#c0c7d0" stroke-width="2">
    <path d="M1086 27h14M1093 20v14"/>
    <rect x="1127" y="20" width="14" height="14" rx="2"/>
    <path d="m1171 21 13 13m0-13-13 13"/>
  </g>
  <path d="M0 56h1200v646a18 18 0 0 1-18 18H18a18 18 0 0 1-18-18Z" fill="url(#page)"/>
  <g filter="url(#shadow)">
    <rect x="330" y="104" width="540" height="566" rx="22" fill="#0b1526" fill-opacity=".96" stroke="#304563"/>
  </g>
  <g transform="translate(378 145)">
    <rect width="72" height="72" rx="16" fill="#1c2d4a"/>
    <rect x="10" y="14" width="52" height="36" rx="7" fill="#3584e4"/>
    <rect x="14" y="18" width="44" height="28" rx="5" fill="#0b1526"/>
    <path d="m29 24 16 8-16 8Z" fill="#f6f5f4"/>
    <rect x="27" y="53" width="18" height="4" rx="2" fill="#3584e4"/>
    <rect x="20" y="60" width="32" height="5" rx="2.5" fill="#99c1f1"/>
  </g>
  <text x="378" y="265" fill="#f6f5f4" font-family="Cantarell, sans-serif" font-size="34" font-weight="700">Apple TV, in its own window</text>
  <text x="378" y="304" fill="#c7d8ef" font-family="Cantarell, sans-serif" font-size="18">TV Web keeps the official website separate from your browser.</text>
  <g font-family="Cantarell, sans-serif" font-size="17">
    <g transform="translate(378 353)">
      <circle cx="9" cy="-6" r="9" fill="#3584e4"/>
      <path d="m5-6 3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
      <text x="30" fill="#deddda">Your sign-in stays in TV Web's local profile.</text>
    </g>
    <g transform="translate(378 399)">
      <circle cx="9" cy="-6" r="9" fill="#3584e4"/>
      <path d="m5-6 3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
      <text x="30" fill="#deddda">Apple account pages stay inside trusted domains.</text>
    </g>
    <g transform="translate(378 445)">
      <circle cx="9" cy="-6" r="9" fill="#3584e4"/>
      <path d="m5-6 3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
      <text x="30" fill="#deddda">Other links open in your default browser.</text>
    </g>
  </g>
  <path d="M378 484h444" stroke="#304563"/>
  <text x="378" y="518" fill="#9fb2ca" font-family="Cantarell, sans-serif" font-size="15">Unofficial and not affiliated with Apple. Playback is provided by</text>
  <text x="378" y="541" fill="#9fb2ca" font-family="Cantarell, sans-serif" font-size="15">tv.apple.com and this Linux web engine.</text>
  <text x="378" y="612" fill="#99c1f1" font-family="Cantarell, sans-serif" font-size="16" font-weight="700">Project details</text>
  <rect x="678" y="576" width="144" height="52" rx="10" fill="#3584e4"/>
  <text x="750" y="609" fill="#fff" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="16" font-weight="700">Open Apple TV</text>
</svg>
