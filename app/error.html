<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TV Web is offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1526;
        color: #f6f5f4;
        font-family: Cantarell, "Noto Sans", sans-serif;
      }
      .wrap {
        min-height: 100%;
        box-sizing: border-box;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        max-width: 36rem;
        line-height: 1.45;
        color: #c0bfbc;
      }
      details {
        max-width: 36rem;
        color: #9a9996;
        font-size: 0.85rem;
      }
      summary {
        cursor: pointer;
      }
      #detail {
        margin-top: 0.5rem;
        overflow-wrap: anywhere;
      }
      button {
        margin-top: 0.75rem;
        background: #3584e4;
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 0.55rem 1.1rem;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Could not open Apple TV</h1>
      <p>Check your network, then try again.</p>
      <details>
        <summary>Technical details</summary>
        <p id="detail">No connection to tv.apple.com.</p>
      </details>
      <button id="retry" type="button">Try again</button>
    </div>
    <script type="module" src="./error.mjs"></script>
  </body>
</html>
